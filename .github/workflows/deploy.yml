name: Deploy Gateway Config

on:
  push:
    branches:
      - staging
      - main
      - hexclad_au

env:
  PROJECT_ID: gen-lang-client-0112051341
  ZONE: australia-southeast1-b

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          find config -name '*.json' -exec python3 -c "
          import json, sys
          try:
              json.load(open(sys.argv[1]))
          except Exception as e:
              print(f'FAIL: {sys.argv[1]}: {e}')
              sys.exit(1)
          " {} \;

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure deployment target
        run: |
          BRANCH="${{ github.ref_name }}"
          case "$BRANCH" in
            main)
              echo "INSTANCE=blossomclaw-production" >> $GITHUB_ENV
              echo "DEPLOY_USER=" >> $GITHUB_ENV
              echo "DEPLOY_PORT=18789" >> $GITHUB_ENV
              echo "BRAND=" >> $GITHUB_ENV
              ;;
            hexclad_au)
              echo "INSTANCE=blossomclaw-staging" >> $GITHUB_ENV
              echo "DEPLOY_USER=hexclad_au" >> $GITHUB_ENV
              echo "DEPLOY_PORT=18790" >> $GITHUB_ENV
              echo "BRAND=hexclad_au" >> $GITHUB_ENV
              ;;
            *)
              echo "INSTANCE=blossomclaw-staging" >> $GITHUB_ENV
              echo "DEPLOY_USER=eli_paperbark_ai" >> $GITHUB_ENV
              echo "DEPLOY_PORT=18789" >> $GITHUB_ENV
              echo "BRAND=" >> $GITHUB_ENV
              ;;
          esac

      - name: Apply brand overlay
        if: ${{ env.BRAND }}
        run: |
          if [ -d "brands/${{ env.BRAND }}/workspace" ]; then
            cp -r "brands/${{ env.BRAND }}/workspace/." config/workspace/
            echo "Applied workspace overlay from brands/${{ env.BRAND }}"
          fi

      - name: Patch gateway port
        if: ${{ env.BRAND }}
        run: |
          python3 -c "
          import json
          with open('config/openclaw.json') as f:
              cfg = json.load(f)
          cfg['gateway']['port'] = ${{ env.DEPLOY_PORT }}
          with open('config/openclaw.json', 'w') as f:
              json.dump(cfg, f, indent=2)
              f.write('\n')
          "

      - name: Strip runtime state from config
        run: |
          # Remove cron job runtime state (nextRunAtMs, lastStatus, etc.)
          # so deploys don't overwrite live scheduling state
          python3 -c "
          import json
          with open('config/cron/jobs.json') as f:
              data = json.load(f)
          for job in data.get('jobs', []):
              job.pop('state', None)
          with open('config/cron/jobs.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/996600922996/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@gen-lang-client-0112051341.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Package and deploy
        run: |
          # Create tarball, excluding runtime state directories
          tar czf /tmp/openclaw-deploy.tar.gz \
            --exclude='./workspace/memory' \
            --exclude='./workspace/MEMORY.md' \
            -C config .

          # Generate deploy script (avoids shell escaping issues in gcloud ssh)
          cat > /tmp/deploy.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          DEPLOY_USER="$1"
          BRAND="$2"

          if [ -n "${DEPLOY_USER}" ]; then
            OPENCLAW_DIR="/home/${DEPLOY_USER}/.openclaw"
            RUN="sudo -u ${DEPLOY_USER}"
          else
            OPENCLAW_DIR="$HOME/.openclaw"
            RUN=""
          fi

          # Backup current config
          ${RUN} cp "${OPENCLAW_DIR}/openclaw.json" \
            "${OPENCLAW_DIR}/openclaw.json.bak.$(date +%s)" 2>/dev/null || true

          # Extract new config (does not delete existing files not in archive)
          ${RUN} tar xzf /tmp/openclaw-deploy.tar.gz -C "${OPENCLAW_DIR}"

          # Read env vars for variable substitution in openclaw.json
          ENV_FILE="${OPENCLAW_DIR}/.env"
          if ${RUN} test -f "${ENV_FILE}" 2>/dev/null; then
            # Safe line-by-line parsing: only export KEY=VALUE lines, skip comments/empty
            while IFS='=' read -r key value; do
              key="$(echo "${key}" | xargs)"
              [[ -z "${key}" || "${key}" == \#* ]] && continue
              export "${key}=${value}"
            done < <(${RUN} cat "${ENV_FILE}")
          fi

          # Validate required env vars
          if [ -z "${OPENCLAW_GATEWAY_TOKEN:-}" ]; then
            echo "ERROR: OPENCLAW_GATEWAY_TOKEN not set in ${ENV_FILE}" >&2
            exit 1
          fi

          # Substitute placeholders in openclaw.json using python for safety
          # (sed breaks if token contains regex special chars)
          TARGET_HOME="${OPENCLAW_DIR%/.openclaw}"
          ${RUN} python3 -c "
          import sys
          with open('${OPENCLAW_DIR}/openclaw.json') as f:
              content = f.read()
          content = content.replace('\${HOME}', sys.argv[1])
          content = content.replace('\${OPENCLAW_GATEWAY_TOKEN}', sys.argv[2])
          with open('${OPENCLAW_DIR}/openclaw.json', 'w') as f:
              f.write(content)
          " "${TARGET_HOME}" "${OPENCLAW_GATEWAY_TOKEN}"

          # Restart the appropriate service
          if [ -n "${BRAND}" ]; then
            BRAND_SLUG="${BRAND//_/-}"
            sudo systemctl restart "openclaw-${BRAND_SLUG}"
          else
            sudo systemctl restart openclaw-gateway 2>/dev/null \
              || (command -v openclaw &>/dev/null && openclaw gateway restart 2>/dev/null) \
              || echo 'Restart signal sent (no service found)'
          fi

          rm -f /tmp/openclaw-deploy.tar.gz /tmp/deploy.sh
          echo "Deploy complete: ${BRAND:-default} on ${OPENCLAW_DIR}"
          SCRIPT

          chmod +x /tmp/deploy.sh

          # Transfer tarball and deploy script to instance
          gcloud compute scp /tmp/openclaw-deploy.tar.gz /tmp/deploy.sh \
            ${{ env.INSTANCE }}:/tmp/ \
            --zone=${{ env.ZONE }}

          # Execute deploy
          gcloud compute ssh ${{ env.INSTANCE }} \
            --zone=${{ env.ZONE }} \
            --command="bash /tmp/deploy.sh '${{ env.DEPLOY_USER }}' '${{ env.BRAND }}'"
