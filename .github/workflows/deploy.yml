name: Deploy Gateway Config

on:
  push:
    branches:
      - staging
      - main

env:
  PROJECT_ID: gen-lang-client-0112051341
  ZONE: australia-southeast1-b

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          find config -name '*.json' -exec python3 -c "
          import json, sys
          try:
              json.load(open(sys.argv[1]))
          except Exception as e:
              print(f'FAIL: {sys.argv[1]}: {e}')
              sys.exit(1)
          " {} \;

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set target instance
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "INSTANCE=blossomclaw-production" >> $GITHUB_ENV
          else
            echo "INSTANCE=blossomclaw-staging" >> $GITHUB_ENV
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/996600922996/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@gen-lang-client-0112051341.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Package and deploy
        run: |
          tar czf /tmp/openclaw-deploy.tar.gz -C config .

          gcloud compute scp /tmp/openclaw-deploy.tar.gz \
            ${{ env.INSTANCE }}:/tmp/openclaw-deploy.tar.gz \
            --zone=${{ env.ZONE }}

          gcloud compute ssh ${{ env.INSTANCE }} \
            --zone=${{ env.ZONE }} \
            --command="
              set -euo pipefail
              OPENCLAW_DIR=\$HOME/.openclaw
              cp \${OPENCLAW_DIR}/openclaw.json \${OPENCLAW_DIR}/openclaw.json.bak.\$(date +%s) 2>/dev/null || true
              tar xzf /tmp/openclaw-deploy.tar.gz -C \${OPENCLAW_DIR}
              if [ -f \${OPENCLAW_DIR}/.env ]; then
                set -a && source \${OPENCLAW_DIR}/.env && set +a
              fi
              sed -i \"s|\\\${HOME}|\${HOME}|g\" \${OPENCLAW_DIR}/openclaw.json
              sed -i \"s|\\\${OPENCLAW_GATEWAY_TOKEN}|\${OPENCLAW_GATEWAY_TOKEN}|g\" \${OPENCLAW_DIR}/openclaw.json
              if command -v openclaw &>/dev/null; then
                openclaw gateway restart 2>/dev/null || echo 'Restart signal sent'
              fi
              rm -f /tmp/openclaw-deploy.tar.gz
              echo 'Deploy complete'
            "
